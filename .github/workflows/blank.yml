name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Locate project
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Repo contents:"; find . -not -path "./.git*" | head -100; exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HoopStats-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
